name: Deploy Production

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Find successful CI build
        id: ci-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="${GITHUB_SHA}" \
            -f status=success \
            -f per_page=20 \
            --jq '[.workflow_runs[] | select(.event == "push")] | first | .id // empty')"
          if [[ -z "$run_id" ]]; then
            echo "No successful CI build found for ${GITHUB_SHA}."
            echo "Push this commit to main and wait for CI before deploying."
            exit 1
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download tested web build
        uses: actions/download-artifact@v4
        with:
          name: web-${{ github.sha }}
          path: build/web
          run-id: ${{ steps.ci-run.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify deploy artifact
        run: |
          test -f build/web/index.html
          test -f build/web/main.dart.wasm
          test -f build/web/flutter_service_worker.js

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: timetable-maker-3c8e0
          channelId: live
          firebaseToolsVersion: latest
