  <!--
    If you are serving your web app in a path other than the root, change the

    it to work correctly.

    For more details:

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Free timetable maker for BITS Pilani, Goa and Hyderabad. Generate clash-free schedules from the course booklet, calculate your CGPA, and browse past papers and notes in the academic drives.">
  <meta name="author" content="Tabulr">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="canonical" href="https://tabulr.net/">

  <!--
    Start the two biggest first-visit downloads immediately, in parallel with
    the boot-watchdog + version check below (which otherwise delay them by a few
    hundred ms). main.dart.js (~4.5 MB) is requested by the bootstrap under this
    exact, un-versioned URL, so the preload lands on the same cache entry.
    CanvasKit is served from gstatic, so we only warm the connection to it.
  -->
  <link rel="preload" href="main.dart.js" as="script" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>

  <!-- PWA theme color -->
  <meta name="theme-color" content="#58A6FF">
  <meta name="color-scheme" content="dark light">

  <!-- iOS PWA support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tabulr">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Tabulr — BITS Pilani Timetable Maker, CGPA Calculator &amp; Academic Drives</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Link previews. This app spreads by people pasting the URL into WhatsApp and
    Discord groups, so these tags are the single highest-traffic piece of HTML
    in the repo — without them a share renders as a bare grey URL.

    Absolute URLs are mandatory: scrapers do not resolve relative paths against
    <base>. og:image must stay a real 1200x630 file (web/og-image.png) rather
    than the favicon, or WhatsApp falls back to a thumbnail-sized card.
  -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Tabulr">
  <meta property="og:url" content="https://tabulr.net/">
  <meta property="og:title" content="Tabulr — BITS Pilani Timetable Maker">
  <meta property="og:description" content="Generate clash-free timetables from the course booklet, calculate your CGPA, and browse past papers and notes in the academic drives. Free, open source, built by BITS students.">
  <meta property="og:image" content="https://tabulr.net/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Tabulr — timetable maker, CGPA calculator and academic drives for BITS Pilani students">
  <meta property="og:locale" content="en_IN">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Tabulr — BITS Pilani Timetable Maker">
  <meta name="twitter:description" content="Generate clash-free timetables from the course booklet, calculate your CGPA, and browse past papers and notes in the academic drives.">
  <meta name="twitter:image" content="https://tabulr.net/og-image.png">

  <!--
    CanvasKit paints the whole UI into a <canvas>, so a crawler executing this
    page finds no readable text. This block is the only structured description
    of the app that search engines can actually parse.

    "@context": "https://schema.org",
    "@type": "SoftwareApplication",

      "Humanities and open elective browser",
      "Academic calendar",
      "Calendar export (ICS) with reminders"
    ]
  }

  <!--
    Google Analytics 4. Inert until GA_MEASUREMENT_ID is filled in — the app
    has exactly one URL today, so this measures sessions, referrers and
    retention, not per-screen behaviour. googletagmanager/google-analytics are
    already allowed by the CSP in firebase.json.
  -->
  <script>
    window.GA_MEASUREMENT_ID = 'G-GPWCL83NSD';
    if (window.GA_MEASUREMENT_ID) {
      var ga = document.createElement('script');
      ga.async = true;
      ga.src = 'https://www.googletagmanager.com/gtag/js?id=' + window.GA_MEASUREMENT_ID;
      document.head.appendChild(ga);
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { window.dataLayer.push(arguments); };
      gtag('js', new Date());
      gtag('config', window.GA_MEASUREMENT_ID);
    }
  </script>

  <script>
    // Paint the boot screen in the colours of the theme the user last used, so
    // the hand-off to the Flutter app is a fade between two identical
    // backgrounds rather than a flash of the wrong one. Written by the app on
    // every theme change; absent on a first-ever visit, where the CSS falls
    // back to system light/dark.
    (function () {
      try {
        var root = document.documentElement.style;
        var bg = localStorage.getItem('tabulr_boot_bg');
        var fg = localStorage.getItem('tabulr_boot_fg');
        var accent = localStorage.getItem('tabulr_boot_accent');
        if (bg) root.setProperty('--boot-bg', bg);
        if (fg) root.setProperty('--boot-fg', fg);
        if (accent) root.setProperty('--boot-accent', accent);
      } catch (e) {}
    })();
  </script>

  <style>
    :root {
      --boot-bg: #0d1117;
      --boot-fg: #e6edf3;
      --boot-accent: #58A6FF;
    }
    @media (prefers-color-scheme: light) {
      :root { --boot-bg: #ffffff; --boot-fg: #1f2328; }
    }
    html, body { margin: 0; height: 100%; }
    body { background: var(--boot-bg); overscroll-behavior-x: none; }

    #loading {
      position: fixed; inset: 0; z-index: 2147483647;
      display: flex; align-items: center; justify-content: center;
      background: var(--boot-bg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      opacity: 1;
      transition: opacity 0.45s ease;
      will-change: opacity;
    }
    /* Faded out the moment Flutter paints its first frame, revealing the app
       underneath — no hard cut. */
    #loading.is-done { opacity: 0; pointer-events: none; }

    .boot__brand {
      display: flex; align-items: center; gap: 16px;
    }
    .boot__logo {
      width: 84px; height: 84px;
      display: block;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.22),
                  0 0 0 1px color-mix(in srgb, var(--boot-fg) 8%, transparent);
    }
    .boot__word {
      font-size: 28px; font-weight: 700; letter-spacing: 0.2px;
      color: var(--boot-fg);
      animation: bootWordIn 0.5s ease both;
    }
    @keyframes bootWordIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: none; }
    }
    /* The calendar frame is static; only the date tiles cycle. Each tile shares
       one keyframe on a fixed period, offset by a per-tile animation-delay — a
       positive delay is a permanent phase offset for a looping animation, so the
       tiles fill in reading order, hold together for a beat, then clear in the
       same wave and refill. */
    .boot-tile {
      transform-box: fill-box; transform-origin: center;
      animation: bootTile 4s ease infinite;
    }
    @keyframes bootTile {
      0%   { opacity: 0; transform: scale(0.2); }
      5%   { opacity: 1; transform: scale(1); }
      66%  { opacity: 1; transform: scale(1); }
      73%  { opacity: 0; transform: scale(0.2); }
      100% { opacity: 0; transform: scale(0.2); }
    }
    @media (prefers-reduced-motion: reduce) {
      .boot__word { animation: none; }
      .boot-tile { animation: none; opacity: 1; }
    }
  </style>
</head>

  <script>
    // Warm the engine download in parallel with the version check below. The
    // check gates the real bootstrap injection (to avoid a flash-then-reload
    // right after a deploy), which otherwise costs one round trip before the
    // engine starts downloading. This preload uses the last known version — the
    // same URL the common, version-unchanged path injects — so the browser
    // reuses these bytes instead of fetching twice, hiding the RTT. On a first
    // visit or a version change it simply does nothing useful and is discarded.
    (function() {
      var prev = localStorage.getItem('app_version');
      if (prev) {
        var l = document.createElement('link');
        l.rel = 'preload';
        l.as = 'script';
        l.href = 'flutter_bootstrap.js?v=' + encodeURIComponent(prev);
        document.head.appendChild(l);
      }
    })();
  </script>

  <script>
    // Boot watchdog. The app's own caches self-heal (a bad entry is caught and
    // re-fetched), but Firestore's IndexedDB persistence is owned by the SDK
    // with no such guard — a corrupt or wedged store (seen on privacy-hardened
    // browsers like Brave) can make startup hang before it ever paints. We
    // count boots that never reach first frame; after two, we assume local
    // state is the problem and purge everything (IndexedDB incl. Firestore,
    // Cache Storage, service workers, localStorage) before booting clean. A
    // healthy boot clears the counter on first frame, so this never runs when
    // things are working, and an intentional post-deploy reload resets it too.
    var BOOT_FAIL_KEY = 'boot_fails';
    var BOOT_FAIL_LIMIT = 2;

    async function purgeLocalState() {
      try {
        if ('serviceWorker' in navigator) {
          var regs = await navigator.serviceWorker.getRegistrations();
          for (var r of regs) await r.unregister();
        }
      } catch (e) {}
      try {
        var keys = await caches.keys();
        for (var k of keys) await caches.delete(k);
      } catch (e) {}
      try {
        if (indexedDB.databases) {
          var dbs = await indexedDB.databases();
          await Promise.all(dbs.map(function (db) {
            return new Promise(function (resolve) {
              try {
                var req = indexedDB.deleteDatabase(db.name);
                req.onsuccess = req.onerror = req.onblocked = function () { resolve(); };
              } catch (e) { resolve(); }
            });
          }));
        }
      } catch (e) {}
      try {
        localStorage.clear();
      } catch (e) {}
    }

    // One-shot repair for browsers that cached assets/ under the old
    // `immutable, max-age=1y` header (see firebase.json). Those files sit at
    // stable URLs but are rebuilt every deploy — MaterialIcons-Regular.otf is
    // tree-shaken to whichever icons the code references — so a stale copy
    // renders newly added icons as nothing. Nothing on the page can evict an
    // HTTP cache entry, but `cache: 'reload'` fetches unconditionally AND
    // overwrites the entry, so Flutter's own request lands on fresh bytes.
    //
    // Runs once per browser, ever. Bump the key to re-arm it. Every path below
    // must really exist in the deploy: hosting rewrites unknown paths to
    // index.html with a 200, so a typo would cache an HTML body at an asset URL.
    var CACHE_BUST_KEY = 'asset_cache_bust_v1';
    var STALE_ASSETS = [
      'assets/fonts/MaterialIcons-Regular.otf',
      // Tree-shaken the same way (down to ~1 KB), same stale-subset failure.
      'assets/packages/cupertino_icons/assets/CupertinoIcons.ttf',
      'assets/FontManifest.json',
      'assets/AssetManifest.bin',
      'assets/AssetManifest.bin.json'
    ];

    async function refreshStaleAssets() {
      try {
        if (localStorage.getItem(CACHE_BUST_KEY) === '1') return;
      } catch (e) { return; }

      // ~45 KB total, and it blocks the bootstrap because the point is to win
      // the race against Flutter's own asset load. Capped so a dead network
      // delays boot rather than hanging it; an incomplete pass just leaves the
      // flag unset and retries next launch.
      var controller = new AbortController();
      var timer = setTimeout(function () { controller.abort(); }, 5000);
      try {
        await Promise.all(STALE_ASSETS.map(function (url) {
          return fetch(url, { cache: 'reload', signal: controller.signal });
        }));
        localStorage.setItem(CACHE_BUST_KEY, '1');
      } catch (e) {
      } finally {
        clearTimeout(timer);
      }
    }

    (async function() {
      // Recover from / count a stuck boot before doing anything else.
      var bootFails = 0;
      try { bootFails = parseInt(localStorage.getItem(BOOT_FAIL_KEY) || '0', 10) || 0; } catch (e) {}
      if (bootFails >= BOOT_FAIL_LIMIT) {
        await purgeLocalState();
        try { localStorage.setItem(BOOT_FAIL_KEY, '0'); } catch (e) {}
      } else {
        // Provisionally mark this attempt as unconfirmed; first frame clears it.
        try { localStorage.setItem(BOOT_FAIL_KEY, String(bootFails + 1)); } catch (e) {}
      }

      var version = '';
      try {
        if ('serviceWorker' in navigator) {
          var regs = await navigator.serviceWorker.getRegistrations();
          for (var r of regs) await r.unregister();
        }

        // Some browsers/extensions (observed on Brave) silently stall this
        // request instead of failing it. Without a cap the bootstrap script
        // below is never injected and the page hangs on the spinner. Abort
        // after a few seconds and fall through to the cached-version path,
        // which reuses the preloaded engine bytes warmed above.
        var controller = new AbortController();
        var timer = setTimeout(function() { controller.abort(); }, 4000);
        var data;
        try {
          var resp = await fetch('version.json?t=' + Date.now(), {
            signal: controller.signal,
            cache: 'no-store'
          });
          data = await resp.json();
        } finally {
          clearTimeout(timer);
        }
        version = data.version || '';
        var prev = localStorage.getItem('app_version');

        if (prev && prev !== version) {
          var keys = await caches.keys();
          for (var k of keys) await caches.delete(k);
          localStorage.setItem('app_version', version);
          // Intentional reload — don't let the watchdog blame it as a stuck boot.
          try { localStorage.setItem(BOOT_FAIL_KEY, '0'); } catch (e) {}
          window.location.reload();
          return;
        }
        localStorage.setItem('app_version', version);
      } catch(e) {
        // Version check failed or timed out: proceed with the last known
        // version so the engine still boots (and reuses the preloaded bytes).
        try { version = localStorage.getItem('app_version') || ''; } catch(_) {}
      }

      await refreshStaleAssets();

      // Load Flutter bootstrap with version query param for cache busting
      var s = document.createElement('script');
      s.src = 'flutter_bootstrap.js' + (version ? '?v=' + encodeURIComponent(version) : '?t=' + Date.now());
      s.async = true;
      document.body.appendChild(s);
    })();
  </script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      // Boot reached first frame — clear the watchdog's failure counter.
      try { localStorage.removeItem(BOOT_FAIL_KEY); } catch (e) {}
      var el = document.getElementById('loading');
      if (!el) return;
      // Fade over the freshly-painted app instead of a hard cut, then remove
      // once the transition has finished so it can't swallow taps.
      el.classList.add('is-done');
      var done = function () { if (el) el.remove(); };
      el.addEventListener('transitionend', done, { once: true });
      setTimeout(done, 700); // fallback if transitionend never fires
    });
  </script>
</body>
</html>
